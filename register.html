<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Register — BOMB ARENA</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="brand"><span class="bomb-emoji">💣</span> BOMB ARENA</div>

    <div class="card">
      <h2>Create Account</h2>

      <form id="registerForm">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required autocomplete="name" />

        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="username" placeholder="3-20 chars, letters/numbers/_" />

        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />

        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="new-password" minlength="6" />

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required autocomplete="new-password" minlength="6" />

        <button type="submit" id="registerBtn">CREATE ACCOUNT</button>
      </form>

      <div id="msg" class="msg"></div>

      <div class="link-row">
        Already have an account? <a href="login.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // If already logged in, no need to register again
    (async () => {
      const user = await getCurrentUser();
      if (user) window.location.href = "profile.html";
    })();

    const form = document.getElementById("registerForm");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("registerBtn");

    function showError(text) {
      msg.className = "msg error";
      msg.textContent = text;
    }
    function showSuccess(text) {
      msg.className = "msg success";
      msg.textContent = text;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg";
      msg.textContent = "";

      const fullName = document.getElementById("fullName").value;
      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (password !== confirmPassword) {
        showError("Passwords do not match.");
        return;
      }

      btn.disabled = true;
      btn.textContent = "CREATING ACCOUNT...";

      try {
        await registerUser({ fullName, username, email, password });
        showSuccess("Account created! Redirecting...");
        // Character customization page is built in the next phase.
        // For now we land on the profile page.
        setTimeout(() => { window.location.href = "profile.html"; }, 900);
      } catch (err) {
        showError(err.message || "Registration failed. Please try again.");
        btn.disabled = false;
        btn.textContent = "CREATE ACCOUNT";
      }
    });
  </script>
</body>
</html>
