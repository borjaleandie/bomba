<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Settings — BOMB ARENA</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .toggle-row { display:flex; align-items:center; justify-content:space-between; padding: 6px 0; }
    .switch { position:relative; width:50px; height:28px; flex-shrink:0; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; inset:0; background: var(--color-bg-input); border:1px solid var(--color-border); border-radius:28px; cursor:pointer; transition:.2s; }
    .slider::before { content:""; position:absolute; height:20px; width:20px; left:3px; top:3px; background:white; border-radius:50%; transition:.2s; }
    input:checked + .slider { background: var(--color-success); }
    input:checked + .slider::before { transform: translateX(22px); }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand" style="font-size:22px;">⚙️ SETTINGS</div>

    <div class="card">
      <div class="toggle-row">
        <div>
          <div style="font-weight:700;">🔊 Sound Effects</div>
          <div style="color:var(--color-text-dim);font-size:12px;">Bomb pickup, throw, explosions, and more.</div>
        </div>
        <label class="switch">
          <input type="checkbox" id="soundToggle" />
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <div class="card">
      <a href="profile.html" class="btn btn-secondary" style="display:block;">👤 EDIT PROFILE</a>
      <a href="character.html" class="btn btn-secondary" style="display:block;">🎨 CUSTOMIZE CHARACTER</a>
    </div>

    <button id="logoutBtn" class="btn-secondary">LOGOUT</button>
    <a href="index.html" class="btn btn-secondary">BACK TO MENU</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sound.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      if (!user) return;

      const toggle = document.getElementById("soundToggle");
      toggle.checked = isSoundEnabled();
      toggle.addEventListener("change", () => {
        setSoundEnabled(toggle.checked);
        if (toggle.checked) playSound("chat"); // quick audible confirmation
      });
    })();

    document.getElementById("logoutBtn").addEventListener("click", logoutUser);
  </script>
</body>
</html>
