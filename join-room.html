<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Join Room — BOMB ARENA</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="brand" style="font-size:22px;">🔑 JOIN ROOM</div>

    <div class="card">
      <form id="joinForm">
        <label for="roomCode">Enter Room Code</label>
        <input type="text" id="roomCode" placeholder="BMB728" maxlength="6"
               style="text-transform:uppercase; letter-spacing:3px; font-size:22px; text-align:center; font-weight:800;" required />

        <button type="submit" id="joinBtn">JOIN ROOM</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>

    <a href="index.html" class="btn btn-secondary">BACK TO MENU</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/room.js"></script>
  <script>
    let currentUser = null;
    (async () => { currentUser = await requireAuth(); })();

    // Force uppercase as the user types, mobile-friendly
    const codeInput = document.getElementById("roomCode");
    codeInput.addEventListener("input", () => {
      codeInput.value = codeInput.value.toUpperCase().replace(/[^A-Z0-9]/g, "");
    });

    document.getElementById("joinForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!currentUser) return;

      const msg = document.getElementById("msg");
      const btn = document.getElementById("joinBtn");
      msg.className = "msg";
      btn.disabled = true;
      btn.textContent = "JOINING...";

      try {
        const room = await joinRoomByCode(codeInput.value, currentUser.id);
        window.location.href = "lobby.html?code=" + room.room_code;
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = err.message || "Could not join room.";
        btn.disabled = false;
        btn.textContent = "JOIN ROOM";
      }
    });
  </script>
</body>
</html>
