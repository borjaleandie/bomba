<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BOMB ARENA — Playing</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/game.css" />
  <style>
    #bombReadyHud {
      position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
      background: rgba(255,209,102,0.15); border: 1px solid var(--color-accent);
      color: var(--color-accent); font-weight: 800; font-size: 13px;
      padding: 6px 14px; border-radius: 20px; z-index: 20;
    }
    #eliminationOverlay {
      position: fixed; inset: 0; background: rgba(10,10,15,0.92);
      display:flex; align-items:center; justify-content:center; flex-direction:column;
      z-index: 999;
    }
    #elimTitle { font-size: 28px; font-weight: 900; color: var(--color-danger); margin-bottom: 10px; }
    #elimNumber { font-size: 90px; font-weight: 900; color: var(--color-accent); }
    #timerLabel {
      position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%);
      background: rgba(20,22,31,0.75); border: 1px solid var(--color-border); border-radius: 10px;
      padding: 6px 16px; font-size: 16px; font-weight: 900; color: var(--color-accent); z-index: 20;
    }
    #roundEndOverlay {
      position: fixed; inset: 0; background: rgba(10,10,15,0.92);
      display:flex; align-items:center; justify-content:center; flex-direction:column;
      z-index: 998; color: var(--color-text-dim); font-weight:700;
    }
    #chatOverlayPanel { padding: 0; }
  </style>
</head>
<body class="game-body">
  <div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div id="hud">
      <div class="hud-pill">💣 <span id="roomCodeLabel">------</span></div>
      <div class="hud-pill" id="mapLabel">Arena</div>
    </div>

    <div id="bombReadyHud" class="hidden">💣 BOMB READY</div>
    <div id="timerLabel">05:00</div>

    <div id="joystickZone"></div>

    <div id="actionZone">
      <button id="pickupBtn" class="action-btn">PICK UP<br>💣</button>
      <button id="throwBtn" class="action-btn">THROW<br>💥</button>
    </div>

    <button id="chatToggleBtn">💬</button>
    <div id="chatOverlayPanel" class="chat-panel hidden"></div>
  </div>

  <div id="eliminationOverlay" class="hidden">
    <div id="elimTitle">💥 ELIMINATED!</div>
    <div id="elimNumber">RESPAWNING...</div>
  </div>

  <div id="roundEndOverlay" class="hidden">
    <div style="font-size:20px;margin-bottom:10px;">⏱️ TIME'S UP</div>
    <div>Calculating results...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/character.js"></script>
  <script src="js/room.js"></script>
  <script src="js/lobby.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/mobile-controls.js"></script>
  <script src="js/player.js"></script>
  <script src="js/realtime.js"></script>
  <script src="js/bomb.js"></script>
  <script src="js/respawn.js"></script>
  <script src="js/scoreboard.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
