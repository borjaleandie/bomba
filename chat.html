<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Chat — BOMB ARENA</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="brand" style="font-size:22px;">💬 CHAT</div>
    <div id="roomLabel" class="room-meta" style="text-align:center;color:var(--color-text-dim);margin-bottom:14px;"></div>

    <div id="errorState" class="hidden card" style="text-align:center;">
      <p>You need a room code to open chat. Join or create a room first.</p>
      <a href="index.html" class="btn">BACK TO MENU</a>
    </div>

    <div id="chatWrap" class="hidden" style="flex:1;display:flex;flex-direction:column;">
      <div class="chat-panel" id="chatPanel" style="flex:1;"></div>
      <a href="index.html" class="btn btn-secondary">BACK TO MENU</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/room.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/sound.js"></script>
  <script>
    (async () => {
      const user = await requireAuth();
      if (!user) return;

      const params = new URLSearchParams(window.location.search);
      const code = (params.get("code") || "").toUpperCase();
      if (!code) { document.getElementById("errorState").classList.remove("hidden"); return; }

      const room = await getRoomByCode(code);
      if (!room) { document.getElementById("errorState").classList.remove("hidden"); return; }

      const { data: profile } = await window.supabaseClient.from("profiles").select("username").eq("id", user.id).single();

      document.getElementById("roomLabel").textContent = `${room.room_name} (${room.room_code})`;
      document.getElementById("chatWrap").classList.remove("hidden");

      mountChatPanel(document.getElementById("chatPanel"), { roomId: room.id, userId: user.id, username: profile.username });
    })();
  </script>
</body>
</html>
