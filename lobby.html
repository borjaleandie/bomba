  <link rel="stylesheet" href="css/style.css" />

  <style>
    .room-code-box {
      text-align: center;
      margin-bottom: 8px;
    }

    .room-code-box .code {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 6px;
      color: var(--color-accent);
    }

    .room-meta {
      text-align: center;
      color: var(--color-text-dim);
      font-size: 13px;
      margin-bottom: 16px;
    }

    .player-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-bottom: 1px solid var(--color-border);
    }

    .player-row:last-child {
      border-bottom: none;
    }

    .color-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .mini-avatar {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--color-bg-input);
      flex-shrink: 0;
    }

    .mini-avatar svg {
      width: 100%;
      height: 100%;
    }

    .player-name {
      flex: 1;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .host-badge {
      font-size: 9px;
      background: var(--color-accent);
      color: #222;
      padding: 2px 6px;
      border-radius: 6px;
      font-weight: 800;
    }

    .offline-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--color-text-dim);
    }

    .ready-pill {
      font-size: 11px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .ready-pill.ready {
      background: rgba(74, 222, 128, 0.15);
      color: var(--color-success);
    }

    .ready-pill.notready {
      background: rgba(248, 113, 113, 0.15);
      color: var(--color-danger);
    }

    .status-line {
      text-align: center;
      font-size: 13px;
      color: var(--color-text-dim);
      margin: 10px 0;
    }

    .status-line b {
      color: var(--color-text);
    }

    #readyBtn.ready-active {
      background: var(--color-success);
    }

    #countdownOverlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 15, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      flex-direction: column;
    }

    #countdownNumber {
      font-size: 120px;
      font-weight: 900;
      color: var(--color-accent);
    }

    #countdownLabel {
      font-size: 18px;
      color: var(--color-text-dim);
      letter-spacing: 2px;
    }
  </style>

</head>

  <!-- Supabase -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script src="js/supabase.js"></script>

  <script src="js/auth.js"></script>

  <script src="js/character.js"></script>

  <script src="js/room.js"></script>

  <script src="js/realtime.js"></script>

  <script src="js/lobby.js"></script>

  <script>

    // =====================================================
    // VARIABLES
    // =====================================================

    let currentUser = null;
    let currentProfile = null;

    let room = null;
    let channel = null;
    let players = [];

    let myIsReady = false;

    let countdownStarted = false;
    let gameRedirected = false;
    let countdownInterval = null;


    const params =
      new URLSearchParams(
        window.location.search
      );


    const roomCodeFromUrl =
      (
        params.get("code") ||
        ""
      ).toUpperCase();


    // =====================================================
    // MAP LABEL
    // =====================================================

    function mapLabel(m) {

      return {

        arena1: "Arena 1",
        arena2: "Arena 2",
        arena3: "Arena 3"

      }[m] || m;

    }


    // =====================================================
    // DURATION LABEL
    // =====================================================

    function durationLabel(s) {

      return Math.round(
        s / 60
      ) + " min";

    }


    // =====================================================
    // INIT
    // =====================================================

    async function init() {

      try {

        currentUser =
          await requireAuth();


        if (!currentUser) {
          return;
        }


        // -------------------------------------------------
        // Load profile
        // -------------------------------------------------

        const {
          data: profile,
          error: profileError
        } =
          await window.supabaseClient
            .from("profiles")
            .select(
              "id, username, full_name, email"
            )
            .eq(
              "id",
              currentUser.id
            )
            .limit(1);


        if (profileError) {

          console.error(
            "Profile loading error:",
            profileError
          );

          showError(
            "Could not load your profile: " +
            profileError.message
          );

          return;

        }


        if (
          !profile ||
          profile.length === 0
        ) {

          showError(
            "Your player profile was not found. Please log out and log in again."
          );

          return;

        }


        currentProfile =
          profile[0];


        if (
          !currentProfile.username
        ) {

          currentProfile.username =
            currentProfile.full_name ||
            "Player";

        }


        // -------------------------------------------------
        // Check room code
        // -------------------------------------------------

        if (!roomCodeFromUrl) {

          showError(
            "No room code provided."
          );

          return;

        }


        // -------------------------------------------------
        // Load room
        // -------------------------------------------------

        room =
          await getRoomByCode(
            roomCodeFromUrl
          );


        if (!room) {

          showError(
            "ROOM NOT FOUND"
          );

          return;

        }


        // -------------------------------------------------
        // Show lobby
        // -------------------------------------------------

        document
          .getElementById(
            "loadingState"
          )
          .classList.add(
            "hidden"
          );


        document
          .getElementById(
            "lobbyContent"
          )
          .classList.remove(
            "hidden"
          );


        document.getElementById(
          "roomCode"
        ).textContent =
          room.room_code;


        renderRoomMeta();


        // -------------------------------------------------
        // Load players
        // -------------------------------------------------

        await refreshPlayers();


        // -------------------------------------------------
        // Subscribe to realtime
        // -------------------------------------------------

        channel =
          subscribeToLobby(
            room.id,

            {
              id:
                currentUser.id,

              username:
                currentProfile.username
            },

            {

              onRoomPlayersChange:
                refreshPlayers,

              onRoomChange:
                onRoomChange,

              onPresenceUpdate:
                onPresenceUpdate

            }
          );


        // -------------------------------------------------
        // Buttons
        // -------------------------------------------------

        document
          .getElementById(
            "readyBtn"
          )
          .addEventListener(
            "click",
            onToggleReady
          );


        document
          .getElementById(
            "startBtn"
          )
          .addEventListener(
            "click",
            onStartGame
          );


        document
          .getElementById(
            "leaveBtn"
          )
          .addEventListener(
            "click",
            onLeave
          );


        // -------------------------------------------------
        // If room is starting
        // -------------------------------------------------

        if (
          room.status === "starting"
        ) {

          if (!room.current_round_id) {

            showError(
              "The room is starting but no active round was found."
            );

            return;

          }

          startCountdownOnce();

        }


        // -------------------------------------------------
        // If room is already playing
        // -------------------------------------------------

        if (
          room.status === "playing"
        ) {

          if (!room.current_round_id) {

            showError(
              "This room is marked as playing, but it has no active round. Please create a new room."
            );

            return;

          }

          goToGame();

        }


      } catch (err) {

        console.error(
          "Lobby initialization error:",
          err
        );


        showError(
          err.message ||
          "Could not load the lobby."
        );

      }

    }


    // =====================================================
    // ERROR
    // =====================================================

    function showError(msg) {

      document
        .getElementById(
          "loadingState"
        )
        .classList.add(
          "hidden"
        );


      document
        .getElementById(
          "lobbyContent"
        )
        .classList.add(
          "hidden"
        );


      document.getElementById(
        "errorMsg"
      ).textContent =
        msg;


      document
        .getElementById(
          "errorState"
        )
        .classList.remove(
          "hidden"
        );

    }


    // =====================================================
    // ROOM META
    // =====================================================

    function renderRoomMeta() {

      document.getElementById(
        "roomMeta"
      ).textContent =

        `${room.room_name} · ` +
        `${mapLabel(room.map)} · ` +
        `${durationLabel(
          room.round_duration_seconds
        )}`;

    }


    // =====================================================
    // PRESENCE
    // =====================================================

    let onlineUserIds =
      new Set();


    function onPresenceUpdate(ids) {

      onlineUserIds =
        ids;

      renderPlayerList();

    }


    // =====================================================
    // REFRESH PLAYERS
    // =====================================================

    async function refreshPlayers() {

      try {

        players =
          await fetchRoomPlayers(
            room.id
          );


        const mine =
          players.find(
            (p) =>
              p.user_id ===
              currentUser.id
          );


        myIsReady =
          mine
            ? mine.is_ready
            : false;


        renderPlayerList();

        renderStatusAndButtons();


      } catch (err) {

        console.error(
          "refreshPlayers error:",
          err
        );


        document.getElementById(
          "statusLine"
        ).textContent =

          err.message ||
          "Could not load players.";

      }

    }


    // =====================================================
    // RENDER PLAYER LIST
    // =====================================================

    function renderPlayerList() {

      const list =
        document.getElementById(
          "playerList"
        );


      list.innerHTML = "";


      players.forEach(
        (p) => {

          const row =
            document.createElement(
              "div"
            );


          row.className =
            "player-row";


          const isOnline =
            onlineUserIds.size === 0 ||
            onlineUserIds.has(
              p.user_id
            );


          row.innerHTML = `

            <span
              class="color-dot"
              style="background:${p.color}"
            ></span>

            <div class="mini-avatar">

              ${
                p.character
                  ? renderCharacterSVG(
                      p.character
                    )
                  : ""
              }

            </div>

            <div class="player-name">

              ${
                p.username ||
                "Player"
              }

              ${
                p.is_host
                  ? '<span class="host-badge">HOST</span>'
                  : ""
              }

              ${
                !isOnline
                  ? '<span class="offline-dot" title="disconnected"></span>'
                  : ""
              }

            </div>

            <span
              class="ready-pill ${
                p.is_ready
                  ? "ready"
                  : "notready"
              }"
            >

              ${
                p.is_ready
                  ? "READY"
                  : "NOT READY"
              }

            </span>

          `;


          list.appendChild(
            row
          );

        }
      );

    }


    // =====================================================
    // STATUS / BUTTONS
    // =====================================================

    function renderStatusAndButtons() {

      const current =
        players.length;


      const required =
        room.player_limit;


      const readyCount =
        players.filter(
          (p) =>
            p.is_ready
        ).length;


      document.getElementById(
        "statusLine"
      ).innerHTML =

        `REQUIRED PLAYERS: <b>${required}</b>
         &nbsp;|&nbsp;
         CURRENT: <b>${current}</b>
         &nbsp;|&nbsp;
         READY: <b>${readyCount}</b>`;


      const readyBtn =
        document.getElementById(
          "readyBtn"
        );


      readyBtn.textContent =
        myIsReady
          ? "✓ READY (tap to cancel)"
          : "READY";


      readyBtn.classList.toggle(
        "ready-active",
        myIsReady
      );


      const myPlayer =
        players.find(
          (p) =>
            p.user_id ===
            currentUser.id
        );


      const isHost =
        myPlayer?.is_host === true;


      const startBtn =
        document.getElementById(
          "startBtn"
        );


      if (
        room.status !== "waiting"
      ) {

        startBtn.classList.add(
          "hidden"
        );

        readyBtn.disabled =
          true;

        return;

      }


      readyBtn.disabled =
        false;


      if (isHost) {

        startBtn.classList.remove(
          "hidden"
        );


        const canStart =
          current === required &&
          readyCount === required;


        startBtn.disabled =
          !canStart;


        startBtn.textContent =
          canStart
            ? "START GAME"
            : `WAITING FOR PLAYERS (${current}/${required})`;

      } else {

        startBtn.classList.add(
          "hidden"
        );

      }

    }


    // =====================================================
    // READY
    // =====================================================

    async function onToggleReady() {

      const readyBtn =
        document.getElementById(
          "readyBtn"
        );


      try {

        readyBtn.disabled =
          true;


        await toggleReady(
          room.id,
          currentUser.id,
          !myIsReady
        );


        await refreshPlayers();


      } catch (err) {

        console.error(
          "Ready button error:",
          err
        );


        alert(
          err.message ||
          "Could not update ready state."
        );


      } finally {

        if (
          room.status ===
          "waiting"
        ) {

          readyBtn.disabled =
            false;

        }

      }

    }


    // =====================================================
    // LEAVE
    // =====================================================

    async function onLeave() {

      const leaveBtn =
        document.getElementById(
          "leaveBtn"
        );


      try {

        leaveBtn.disabled =
          true;


        await leaveRoom(
          room.id,
          currentUser.id
        );


      } catch (err) {

        console.error(
          "Leave room error:",
          err
        );


        alert(
          err.message ||
          "Could not leave the room."
        );


        leaveBtn.disabled =
          false;


        return;

      }


      try {

        if (channel) {

          await unsubscribeChannel(
            channel
          );

        }

      } catch (err) {

        console.warn(
          "Could not unsubscribe:",
          err
        );

      }


      window.location.href =
        "index.html";

    }


    // =====================================================
    // HOST START GAME
    // =====================================================

    async function onStartGame() {

      const startBtn =
        document.getElementById(
          "startBtn"
        );


      if (
        startBtn.disabled ||
        countdownStarted
      ) {

        return;

      }


      try {

        startBtn.disabled =
          true;

        startBtn.textContent =
          "STARTING...";


        console.log(
          "Starting game..."
        );


        // =================================================
        // IMPORTANT:
        //
        // beginStartSequence() is the actual start function
        // defined in js/lobby.js.
        //
        // It checks:
        // 1. Host
        // 2. Players
        // 3. Ready status
        // 4. Game round
        // 5. current_round_id
        // 6. Room status
        // =================================================

        const startedRoom =
          await beginStartSequence(
            room.id
          );


        // Update local room
        room =
          startedRoom;


        console.log(
          "GAME STARTED SUCCESSFULLY"
        );

        console.log(
          "ROOM ID:",
          room.id
        );

        console.log(
          "ROOM STATUS:",
          room.status
        );

        console.log(
          "CURRENT ROUND:",
          room.current_round_id
        );


        // -------------------------------------------------
        // SAFETY CHECK
        // -------------------------------------------------

        if (
          room.status !== "playing" ||
          !room.current_round_id
        ) {

          throw new Error(
            "Game started incorrectly: no active round was attached."
          );

        }


        // -------------------------------------------------
        // Start countdown.
        // -------------------------------------------------

        startCountdownOnce();


      } catch (err) {

        console.error(
          "Start game error:",
          err
        );


        alert(
          err.message ||
          "Could not start game."
        );


        startBtn.disabled =
          false;


        renderStatusAndButtons();

      }

    }


    // =====================================================
    // ROOM REALTIME CHANGE
    // =====================================================

    function onRoomChange(newRoom) {

      if (!newRoom) {
        return;
      }


      console.log(
        "Realtime room update:",
        newRoom
      );


      room =
        newRoom;


      if (
        newRoom.status ===
        "starting"
      ) {

        if (
          newRoom.current_round_id
        ) {

          startCountdownOnce();

        } else {

          console.warn(
            "Room is starting but current_round_id is missing."
          );

        }

        return;

      }


      if (
        newRoom.status ===
        "playing"
      ) {

        if (
          !newRoom.current_round_id
        ) {

          console.error(
            "Room is playing but has no current_round_id."
          );

          return;

        }


        goToGame();

      }

    }


    // =====================================================
    // START COUNTDOWN ONLY ONCE
    // =====================================================

    function startCountdownOnce() {

      if (
        countdownStarted
      ) {

        return;

      }


      if (
        gameRedirected
      ) {

        return;

      }


      countdownStarted =
        true;


      runCountdown();

    }


    // =====================================================
    // COUNTDOWN
    // =====================================================

    function runCountdown() {

      const overlay =
        document.getElementById(
          "countdownOverlay"
        );


      const numberEl =
        document.getElementById(
          "countdownNumber"
        );


      const labelEl =
        document.getElementById(
          "countdownLabel"
        );


      overlay.classList.remove(
        "hidden"
      );


      let n = 3;


      numberEl.textContent =
        n;


      labelEl.textContent =
        "GET READY";


      if (
        countdownInterval
      ) {

        clearInterval(
          countdownInterval
        );

      }


      countdownInterval =
        setInterval(
          () => {

            n--;


            if (
              n > 0
            ) {

              numberEl.textContent =
                n;

              return;

            }


            numberEl.textContent =
              "GO!";


            labelEl.textContent =
              "BOMB ARENA";


            clearInterval(
              countdownInterval
            );


            countdownInterval =
              null;


            setTimeout(
              () => {

                goToGame();

              },
              500
            );


          },
          1000
        );

    }


    // =====================================================
    // GO TO GAME
    // =====================================================

    function goToGame() {

      if (
        gameRedirected
      ) {

        return;

      }


      if (
        !room ||
        room.status !== "playing" ||
        !room.current_round_id
      ) {

        console.error(
          "Cannot enter game: active round is missing.",
          room
        );

        return;

      }


      gameRedirected =
        true;


      if (
        countdownInterval
      ) {

        clearInterval(
          countdownInterval
        );

        countdownInterval =
          null;

      }


      console.log(
        "Entering game..."
      );


      console.log(
        "Room:",
        room.id
      );


      console.log(
        "Round:",
        room.current_round_id
      );


      const code =
        room?.room_code ||
        roomCodeFromUrl;


      window.location.href =
        "game.html?code=" +
        encodeURIComponent(
          code
        );

    }


    // =====================================================
    // START LOBBY
    // =====================================================

    init();


    // =====================================================
    // CLEANUP
    // =====================================================

    window.addEventListener(
      "beforeunload",
      () => {

        if (
          countdownInterval
        ) {

          clearInterval(
            countdownInterval
          );

        }


        if (channel) {

          window.supabaseClient
            .removeChannel(
              channel
            );

        }

      }
    );

  </script>
