<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
  <title>Reset Password — BOMB ARENA</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="page">
    <div class="brand"><span class="bomb-emoji">💣</span> BOMB ARENA</div>

    <div class="card">
      <h2>Set New Password</h2>
      <form id="resetForm">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" required minlength="6" autocomplete="new-password" />

        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password" />

        <button type="submit" id="resetBtn">UPDATE PASSWORD</button>
      </form>
      <div id="msg" class="msg"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById("resetForm");
    const msg = document.getElementById("msg");
    const btn = document.getElementById("resetBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (newPassword !== confirmPassword) {
        msg.className = "msg error";
        msg.textContent = "Passwords do not match.";
        return;
      }

      btn.disabled = true;
      btn.textContent = "UPDATING...";

      try {
        await updatePassword(newPassword);
        msg.className = "msg success";
        msg.textContent = "Password updated! Redirecting to login...";
        setTimeout(() => { window.location.href = "login.html"; }, 1200);
      } catch (err) {
        msg.className = "msg error";
        msg.textContent = err.message || "Could not update password. The link may have expired.";
        btn.disabled = false;
        btn.textContent = "UPDATE PASSWORD";
      }
    });
  </script>
</body>
</html>
